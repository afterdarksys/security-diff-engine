name: Publish NPM Package

# This workflow publishes your npm package to npmjs.org
# Trigger options:
# 1. Automatically on GitHub release creation
# 2. Manually via workflow_dispatch

on:
  # Trigger on release creation
  release:
    types: [created]

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publish mode (test or prod)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      version:
        description: 'Version to publish (e.g., 1.0.0) - leave empty to use current'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if [ -f "package.json" ] && grep -q "\"test\"" package.json; then
            npm test || echo "Tests failed but continuing"
          else
            echo "No tests defined"
          fi

      - name: Build package
        run: |
          if grep -q "\"build\"" package.json; then
            npm run build
          else
            echo "No build script defined"
          fi

      - name: Update version (if specified)
        if: github.event.inputs.version != ''
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Publish to npm (test mode - next tag)
        if: github.event.inputs.mode == 'test'
        run: npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (prod mode - latest tag)
        if: github.event.inputs.mode == 'prod' || github.event_name == 'release'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "## Published Successfully! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`$PACKAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$PACKAGE_VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            echo "**Install:** \`npm install $PACKAGE_NAME@next\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Install:** \`npm install $PACKAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
          fi

# Setup Instructions:
#
# 1. Get your npm token:
#    - Log in to npmjs.com
#    - Go to: https://www.npmjs.com/settings/YOUR_USERNAME/tokens
#    - Click "Generate New Token"
#    - Choose "Automation" type
#    - Copy the token (starts with npm_...)
#
# 2. Add token to GitHub Secrets:
#    - Go to your repo: Settings → Secrets and variables → Actions
#    - Click "New repository secret"
#    - Name: NPM_TOKEN
#    - Value: [paste your npm token]
#    - Click "Add secret"
#
# 3. Usage:
#
#    Option A - Automatic (on release):
#    - Create a GitHub release
#    - Workflow runs automatically
#    - Publishes with 'latest' tag
#
#    Option B - Manual:
#    - Go to Actions → "Publish NPM Package"
#    - Click "Run workflow"
#    - Choose mode: test (next tag) or prod (latest tag)
#    - Optionally specify version
#    - Click "Run workflow"
#
# 4. Copy this file to your package:
#    cp .github/workflows/npm-publish-template.yml YOUR_PACKAGE/.github/workflows/publish.yml
#
# 5. Customize as needed:
#    - Node version
#    - Test commands
#    - Build commands
#    - Publish options
