version: '3.8'

services:
  llmsecurity-web:
    build: .
    container_name: llmsecurity-web
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - llmsecurity-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  llmsecurity-network:
    driver: bridge
